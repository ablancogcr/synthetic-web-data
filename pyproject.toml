[project]
name = "synthetic-web-analytics-pipeline"
version = "0.1.0"
description = "Reusable synthetic web analytics pipeline with Postgres, dbt, Streamlit, and optional Railway Cron support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.8.0",
    "dbt-postgres>=1.8.0",
    "faker>=25.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=6.7.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
